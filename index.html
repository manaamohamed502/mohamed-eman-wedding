<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دعوة زفاف محمد وإيمان</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الظرف -->

    <div id="envelope-screen">

        <div class="envelope-container">

            <img
                src="./images/envelope.jpeg"
                style="width: 300px;height: auto;display: block;"
                alt="Envelope"
            >

            <div class="initials">
                open invitation
            </div>

            <button
                class="seal-button"
                onclick="openInvitation()"
                aria-label="فتح الدعوة">
            </button>

        </div>

    </div>


    <!-- الدعوة -->

    <main id="invitation">

        <!-- الصفحة الأولى -->

        <section class="page active" id="page1">

            <img
                src="./images/page1.jpeg"
                class="page-image"
                alt="دعوة الزفاف"
            >

            <button
                class="next-button"
                onclick="nextPage()">
                الصفحة التالية
            </button>


        </section>


        <!-- الصفحة الثانية -->

        <section class="page" id="page2">

            <img
                src="file:///C:\Users\pc\Desktop\wedding invitation\images/page2.jpeg"
                class="page-image"
                alt=" page2"
            >
            <div class="event-info">

                <div class="countdown">
                    <div>
                       <span id="days">00</span>
                       <small>يوم</small>
                    </div>

                    <div>
                     <span id="hours">00</span>
                     <small>ساعة</small>
                    </div>

                    <div>
                     <span id="minutes">00</span>
                     <small>دقيقة</small>
                    </div>

                    <div>
                     <span id="seconds">00</span>
                     <small>ثانية</small>
                    </div>
                </div>

                <a
                 href="https://maps.google.com/?q=30.546118,31.157267"
                 target="_blank"
                 class="location-button">
                 <img src="./images/location.png" alt="location">
        
                 <span>view location</span>
                </a>

            </div>
        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
